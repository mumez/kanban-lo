[tools]
node = "lts"

[tasks.prepare-web]
description = "Install dependencies for web ui"
dir = "web"
run = "npm install"

[tasks.prepare-cli]
description = "Install dependencies for CLI"
dir = "scripts"
run = "npm install"

[tasks.prepare]
description = "Install dependencies (web + cli)"
depends = ["prepare-web", "prepare-cli"]

[tasks.test-web]
description = "Run web unit tests"
dir = "web"
run = "npm test"

[tasks.test-cli]
description = "Run kbl CLI unit tests"
dir = "scripts"
run = "npm test"

[tasks.test]
description = "Run all unit tests (web + cli)"
depends = ["test-web", "test-cli"]

[tasks.build-web]
description = "Build the web SPA (tsc + vite build)"
dir = "web"
run = "npm run build"

[tasks.serve]
description = "Build the web SPA and start the Caddy server (WebDAV + static)"
depends = ["build-web"]
run = "docker compose up --build"

[tasks.list-issues]
description = "kbl list-issues -- list issues in a column (e.g. mise run list-issues -- --status todo --max 10)"
dir = "scripts"
run = "npx tsx src/cli.ts list-issues"

[tasks.fetch-issue]
description = "kbl fetch-issue -- fetch an issue by id (e.g. mise run fetch-issue -- --id <id>)"
dir = "scripts"
run = "npx tsx src/cli.ts fetch-issue"

[tasks.change-issue]
description = "kbl change-issue -- change an issue's status/content (e.g. mise run change-issue -- --id <id> --status done)"
dir = "scripts"
run = "npx tsx src/cli.ts change-issue"

[tasks.create-issue]
description = "kbl create-issue -- create a new issue (e.g. mise run create-issue -- --subject 'new subject')"
dir = "scripts"
run = "npx tsx src/cli.ts create-issue"
